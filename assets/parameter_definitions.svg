<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <title>Helix 2D Flat parameter definitions</title>
  <desc>
    Annotated nucleic-acid duplex schematic showing the geometry, typography,
    stroke, and color parameters accepted by Helix 2D Flat.
  </desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4"
            orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#2563a6"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, Helvetica, sans-serif; fill: #111827; }
      .subtitle { font: 700 18px Arial, Helvetica, sans-serif; fill: #374151; }
      .base-label { font: 700 25px Arial, Helvetica, sans-serif; fill: #111111; }
      .terminal-label { font: 700 28px Arial, Helvetica, sans-serif; fill: #111111; }
      .measure-label { font: 600 16px "Courier New", monospace; fill: #174f86; }
      .note { font: 15px Arial, Helvetica, sans-serif; fill: #4b5563; }
      .swatch-label { font: 15px "Courier New", monospace; fill: #1f2937; }
      .shape { stroke: #111111; stroke-width: 3; }
      .bond { fill: none; stroke: #111111; stroke-width: 3; stroke-linecap: round; }
      .pair-bond { fill: none; stroke: #111111; stroke-width: 2; stroke-dasharray: 5 5; }
      .measure { fill: none; stroke: #2563a6; stroke-width: 1.7;
                 marker-start: url(#arrow); marker-end: url(#arrow); }
      .extension { fill: none; stroke: #7aa6cc; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .callout { fill: none; stroke: #2563a6; stroke-width: 1.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="820" fill="#ffffff"/>
  <rect x="20" y="20" width="1160" height="780" rx="18" fill="#f8fafc" stroke="#d9e2ec"/>
  <text x="600" y="58" text-anchor="middle" class="title">Helix 2D Flat parameter definitions</text>
  <text x="600" y="84" text-anchor="middle" class="note">
    Blue arrows show the distances controlled by the corresponding command-line or GUI setting.
  </text>

  <!-- Main duplex geometry -->
  <g id="duplex">
    <!-- Backbone bonds -->
    <path d="M 214 220 L 184 220 L 145 194" class="bond"/>
    <path d="M 145 246 L 184 270 L 214 270" class="bond"/>
    <path d="M 214 440 L 184 440 L 148 440" class="bond"/>
    <path d="M 145 466 L 184 490 L 214 490" class="bond"/>
    <path d="M 986 220 L 1016 220 L 1055 194" class="bond"/>
    <path d="M 1055 246 L 1016 270 L 986 270" class="bond"/>
    <path d="M 986 440 L 1016 440 L 1052 440" class="bond"/>
    <path d="M 1055 466 L 1016 490 L 986 490" class="bond"/>

    <!-- Phosphates -->
    <circle cx="120" cy="220" r="28" fill="#d842c2" class="shape"/>
    <circle cx="120" cy="440" r="28" fill="#d842c2" class="shape"/>
    <circle cx="1080" cy="220" r="28" fill="#f3c0e8" class="shape"/>
    <circle cx="1080" cy="440" r="28" fill="#f3c0e8" class="shape"/>

    <!-- Sugars -->
    <polygon points="214,220 236,246 270,236 270,204 236,194"
             fill="#d842c2" class="shape"/>
    <polygon points="214,440 236,466 270,456 270,424 236,414"
             fill="#d842c2" class="shape"/>
    <polygon points="986,220 964,194 930,204 930,236 964,246"
             fill="#f3c0e8" class="shape"/>
    <polygon points="986,440 964,414 930,424 930,456 964,466"
             fill="#f3c0e8" class="shape"/>

    <!-- Sugar-base bonds -->
    <line x1="270" y1="220" x2="320" y2="220" class="bond"/>
    <line x1="270" y1="440" x2="320" y2="440" class="bond"/>
    <line x1="880" y1="220" x2="930" y2="220" class="bond"/>
    <line x1="880" y1="440" x2="930" y2="440" class="bond"/>

    <!-- Bases: purine on left, pyrimidine on right -->
    <rect x="320" y="194" width="170" height="52" fill="#d842c2" class="shape"/>
    <rect x="320" y="414" width="170" height="52" fill="#d842c2" class="shape"/>
    <rect x="710" y="194" width="170" height="52" fill="#f3c0e8" class="shape"/>
    <rect x="710" y="414" width="170" height="52" fill="#f3c0e8" class="shape"/>

    <!-- Optional base-pair lines -->
    <line x1="490" y1="212" x2="710" y2="212" class="pair-bond"/>
    <line x1="490" y1="228" x2="710" y2="228" class="pair-bond"/>
    <line x1="490" y1="424" x2="710" y2="424" class="pair-bond"/>
    <line x1="490" y1="440" x2="710" y2="440" class="pair-bond"/>
    <line x1="490" y1="456" x2="710" y2="456" class="pair-bond"/>

    <!-- Labels demonstrate padding and font size -->
    <text x="334" y="221" dominant-baseline="middle" text-anchor="start" class="base-label">A1</text>
    <text x="866" y="221" dominant-baseline="middle" text-anchor="end" class="base-label">T2</text>
    <text x="334" y="441" dominant-baseline="middle" text-anchor="start" class="base-label">G2</text>
    <text x="866" y="441" dominant-baseline="middle" text-anchor="end" class="base-label">C1</text>
    <text x="78" y="169" text-anchor="end" class="terminal-label">5'</text>
  </g>

  <!-- Horizontal measurements -->
  <g id="horizontal-measurements">
    <line x1="320" y1="194" x2="320" y2="126" class="extension"/>
    <line x1="490" y1="194" x2="490" y2="126" class="extension"/>
    <line x1="320" y1="138" x2="490" y2="138" class="measure"/>
    <text x="405" y="122" text-anchor="middle" class="measure-label">purine_width</text>

    <line x1="490" y1="194" x2="490" y2="105" class="extension"/>
    <line x1="710" y1="194" x2="710" y2="105" class="extension"/>
    <line x1="490" y1="106" x2="710" y2="106" class="measure"/>
    <text x="600" y="100" text-anchor="middle" class="measure-label">pair_gap</text>

    <line x1="710" y1="194" x2="710" y2="126" class="extension"/>
    <line x1="880" y1="194" x2="880" y2="126" class="extension"/>
    <line x1="710" y1="138" x2="880" y2="138" class="measure"/>
    <text x="795" y="122" text-anchor="middle" class="measure-label">pyrimidine_width</text>

    <line x1="270" y1="246" x2="270" y2="286" class="extension"/>
    <line x1="320" y1="246" x2="320" y2="286" class="extension"/>
    <line x1="270" y1="278" x2="320" y2="278" class="measure"/>
    <text x="295" y="302" text-anchor="middle" class="measure-label">base_bond_length</text>

    <line x1="320" y1="246" x2="320" y2="318" class="extension"/>
    <line x1="334" y1="246" x2="334" y2="318" class="extension"/>
    <line x1="320" y1="310" x2="334" y2="310" class="measure"/>
    <text x="327" y="336" text-anchor="middle" class="measure-label">base_label_padding</text>
  </g>

  <!-- Vertical and radial measurements -->
  <g id="vertical-measurements">
    <line x1="92" y1="220" x2="48" y2="220" class="extension"/>
    <line x1="92" y1="440" x2="48" y2="440" class="extension"/>
    <line x1="56" y1="220" x2="56" y2="440" class="measure"/>
    <text x="40" y="330" text-anchor="middle" class="measure-label"
          transform="rotate(-90 40 330)">row_spacing</text>

    <line x1="490" y1="194" x2="535" y2="194" class="extension"/>
    <line x1="490" y1="246" x2="535" y2="246" class="extension"/>
    <line x1="527" y1="194" x2="527" y2="246" class="measure"/>
    <text x="545" y="220" dominant-baseline="middle" class="measure-label">base_height</text>

    <line x1="120" y1="220" x2="148" y2="220" class="measure"/>
    <text x="134" y="253" text-anchor="middle" class="measure-label">phosphate_radius</text>

    <line x1="242" y1="220" x2="270" y2="204" class="measure"/>
    <text x="242" y="180" text-anchor="middle" class="measure-label">sugar_radius</text>

    <line x1="184" y1="440" x2="214" y2="440" class="measure"/>
    <text x="199" y="405" text-anchor="middle" class="measure-label">phosphate_kink_length</text>
  </g>

  <!-- Typography and line callouts -->
  <g id="callouts">
    <path d="M 392 345 C 382 318 365 270 353 231" class="callout"/>
    <text x="395" y="354" class="measure-label">font_size</text>

    <path d="M 160 124 C 126 124 102 142 91 158" class="callout"/>
    <text x="164" y="120" class="measure-label">terminal_font_size</text>

    <path d="M 860 350 C 888 332 911 300 927 241" class="callout"/>
    <text x="785" y="362" class="measure-label">stroke_width</text>

    <path d="M 690 365 C 660 350 635 318 616 236" class="callout"/>
    <text x="575" y="380" class="measure-label">base_pair_line_color</text>
  </g>

  <!-- Notes and color legend -->
  <line x1="70" y1="535" x2="1130" y2="535" stroke="#d9e2ec"/>
  <text x="70" y="570" class="subtitle">Related width setting</text>
  <text x="70" y="598" class="note">
    <tspan class="swatch-label">ambiguous_width</tspan>
    <tspan> controls the base rectangle width for IUPAC ambiguous symbols; label text can expand any rectangle when needed.</tspan>
  </text>

  <text x="70" y="642" class="subtitle">Color parameters</text>
  <g transform="translate(70 664)">
    <rect x="0" y="0" width="28" height="28" rx="4" fill="#d842c2" stroke="#111111"/>
    <text x="38" y="19" class="swatch-label">left_color</text>

    <rect x="190" y="0" width="28" height="28" rx="4" fill="#f3c0e8" stroke="#111111"/>
    <text x="228" y="19" class="swatch-label">right_color</text>

    <rect x="390" y="0" width="28" height="28" rx="4" fill="#111111"/>
    <text x="428" y="19" class="swatch-label">outline_color</text>

    <rect x="620" y="0" width="28" height="28" rx="4" fill="#111111"/>
    <text x="658" y="19" class="swatch-label">text_color</text>

    <rect x="820" y="0" width="28" height="28" rx="4" fill="#e83e52" stroke="#111111"/>
    <text x="858" y="19" class="swatch-label">oxygen_color</text>
  </g>

  <g transform="translate(70 714)">
    <rect x="0" y="0" width="28" height="28" rx="4" fill="#ffffff" stroke="#9ca3af"/>
    <text x="38" y="19" class="swatch-label">background</text>

    <line x1="190" y1="14" x2="230" y2="14" class="pair-bond"/>
    <text x="242" y="19" class="swatch-label">base_pair_line_color</text>

    <text x="505" y="19" class="note">
      All dimensions are SVG user units; the default SVG uses a matching pixel viewBox.
    </text>
  </g>
</svg>
